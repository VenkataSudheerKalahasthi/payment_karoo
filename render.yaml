# ==============================================================================
# TRUSTPAY ENTERPRISE v2.0 — RENDER DEPLOYMENT BLUEPRINT
# ==============================================================================
services:
  - type: web
    name: trustpay-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build:shared && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: SUPERADMIN_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: STORAGE_SIGNING_SECRET
        sync: false
      - key: PAYMENTS_LIVE_ENABLED
        value: "false"
      - key: ESCROW_LIVE_MOVEMENT_ENABLED
        value: "false"
      - key: PAYOUTS_ENABLED
        value: "false"
      - key: CASHFREE_ENV
        value: SANDBOX

